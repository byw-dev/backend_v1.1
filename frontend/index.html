<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BY Weather Flight Command</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >
    <link rel="stylesheet" href="/static/styles.css?v=20260430-command-ui">
</head>
<body>
    <header class="topbar">
        <div class="brand-lockup">
            <span class="system-mark" aria-hidden="true"></span>
            <div>
                <h1>BY Weather Flight Command</h1>
                <p class="subtitle">无人机气象观测 · 航空态势指挥界面</p>
            </div>
        </div>
        <div class="status-group">
            <span class="pill pill-neutral" id="ws-status">链路 待连接</span>
            <span class="pill pill-neutral" id="mode-status">模式 实时监控</span>
            <span class="pill pill-neutral" id="latest-time">最新 --:--:--</span>
            <span class="pill pill-neutral" id="current-date">日期 ----/--/--</span>
            <span class="pill pill-neutral" id="history-limit">历史窗 60min</span>
        </div>
    </header>

    <main class="dashboard">
        <aside class="control-panel command-rail" aria-label="任务控制">
            <div class="rail-section">
                <div class="rail-title">时间窗口</div>
                <label>
                    <span>历史长度</span>
                    <input id="window-minutes" type="number" min="1" step="1" value="10">
                    <span>min</span>
                </label>
                <label>
                    <span>回放点间隔</span>
                    <input id="replay-point-seconds" type="number" min="1" step="1" value="10">
                    <span>s</span>
                </label>
                <button id="apply-window" type="button">应用窗口</button>
            </div>

            <div class="rail-section">
                <div class="rail-title">飞行回放</div>
                <div class="button-grid">
                    <button id="live-mode-btn" type="button">实时</button>
                    <button id="replay-mode-btn" type="button">回放</button>
                    <button id="replay-play-btn" type="button">播放</button>
                    <button id="replay-pause-btn" type="button">暂停</button>
                </div>
                <label class="slider-wrap">
                    <span>回放轴</span>
                    <input id="replay-slider" type="range" min="0" max="0" value="0">
                    <span id="selected-time-label">--:--:--</span>
                </label>
            </div>

            <div class="rail-section">
                <div class="rail-title">地图图层</div>
                <label>
                    <span>底图</span>
                    <select id="map-source">
                        <option value="local">本地离线</option>
                        <option value="online">在线 OSM</option>
                        <option value="satellite">在线卫星</option>
                    </select>
                </label>
                <label>
                    <span>卫星产品</span>
                    <select id="himawari-product">
                        <option value="infrared_b13">Himawari 红外 B13</option>
                        <option value="visible_b03">Himawari 可见光 B03</option>
                    </select>
                </label>
                <label class="toggle">
                    <input id="himawari-overlay-enabled" type="checkbox">
                    <span>叠加卫星图像</span>
                </label>
                <label class="toggle">
                    <input id="radar-overlay-enabled" type="checkbox" checked>
                    <span>叠加雷达</span>
                </label>
                <label class="toggle">
                    <input id="radar-coverage-enabled" type="checkbox">
                    <span>雷达覆盖</span>
                </label>
                <label class="radar-opacity-wrap">
                    <span>雷达透明度</span>
                    <input id="radar-opacity" type="range" min="0" max="100" value="55">
                    <span id="radar-opacity-value">55%</span>
                </label>
            </div>

            <div class="rail-section">
                <div class="rail-title">粒子谱显示</div>
                <label class="toggle">
                    <input id="show-scdp-bins" type="checkbox" checked>
                    <span>显示 SCDP bins</span>
                </label>
                <label class="toggle">
                    <input id="show-icfp-bins" type="checkbox" checked>
                    <span>显示 ICFP bins</span>
                </label>
            </div>
        </aside>

        <section class="center-stack">
            <section class="panel panel-map grid-map">
                <div class="panel-header">
                    <div>
                        <h2>航空态势地图</h2>
                        <span>轨迹、雷达、Himawari 卫星云图综合显示</span>
                    </div>
                    <span id="track-summary">轨迹点 0</span>
                </div>
                <div id="track-map"></div>
            </section>

            <section class="timeline-strip" aria-label="时序图表">
                <button class="timeline-cue timeline-cue-left" type="button" aria-label="上一张图">&lt;</button>
                <section class="panel panel-wide timeline-card">
                    <div class="panel-header">
                        <div>
                            <h2>SCDP 时间序列</h2>
                        </div>
                        <span id="scdp-status">--</span>
                    </div>
                    <div id="scdp-series-chart" class="chart chart-medium-wide"></div>
                </section>

                <section class="panel panel-wide timeline-card">
                    <div class="panel-header">
                        <div>
                            <h2>ICFP 时间序列</h2>
                        </div>
                        <span id="icfp-status">--</span>
                    </div>
                    <div id="icfp-series-chart" class="chart chart-medium-wide"></div>
                </section>

                <section class="panel panel-wide timeline-card">
                    <div class="panel-header">
                        <div>
                            <h2>过冷水汽饱和区识别</h2>
                        </div>
                    </div>
                    <div id="mwr-saturated-zone-chart" class="chart chart-heatmap"></div>
                </section>
                <button class="timeline-cue timeline-cue-right" type="button" aria-label="下一张图">&gt;</button>
            </section>
        </section>

        <section class="right-stack" aria-label="传感器图表">
            <section class="panel grid-mwr-scalar">
                <div class="panel-header">
                    <div>
                        <h2>MWR 综合态势</h2>
                        <span>地面微波辐射计</span>
                    </div>
                    <span id="mwr-status">--</span>
                </div>
                <div id="mwr-scalar-chart" class="chart chart-grid-cell"></div>
            </section>

            <section class="panel grid-icfp-bins">
                <div class="panel-header">
                    <h2>ICFP 粒径谱</h2>
                </div>
                <div id="icfp-bins-chart" class="chart chart-grid-cell"></div>
            </section>

            <section class="panel grid-scdp-bins">
                <div class="panel-header">
                    <h2>SCDP 粒径谱</h2>
                </div>
                <div id="scdp-bins-chart" class="chart chart-grid-cell"></div>
            </section>

            <section class="panel panel-wide profile-panel">
                <div class="panel-header">
                    <div>
                        <h2>MWR 温度廓线</h2>
                    </div>
                    <span id="mwr-profile-time">--:--:--</span>
                </div>
                <div id="mwr-temp-profile-chart" class="chart chart-profile"></div>
            </section>

            <section class="panel panel-wide">
                <div class="panel-header">
                    <div>
                        <h2>MWR 湿度廓线</h2>
                    </div>
                </div>
                <div id="mwr-hum-profile-chart" class="chart chart-profile"></div>
            </section>

            <section class="panel panel-wide">
                <div class="panel-header">
                    <div>
                        <h2>MWR 水汽密度廓线</h2>
                    </div>
                </div>
                <div id="mwr-vapor-profile-chart" class="chart chart-profile"></div>
            </section>

            <section class="panel panel-wide">
                <div class="panel-header">
                    <div>
                        <h2>MWR 液态水廓线</h2>
                    </div>
                </div>
                <div id="mwr-liquid-profile-chart" class="chart chart-profile"></div>
            </section>
        </section>
    </main>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="/static/app.js?v=20260503-track-zero-filter"></script>
</body>
</html>
